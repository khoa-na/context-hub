<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>context-hub</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <nav class="navbar">
      <div class="navbar-inner">
        <div class="navbar-brand">
          <span class="logo-icon">&#9670;</span> context-hub
        </div>
        <div class="navbar-actions">
          <button id="new-session-button" class="nav-btn" type="button">
            <span class="btn-icon">&#10227;</span> New Session
          </button>
          <button id="settings-toggle" class="nav-btn" type="button">
            <span class="btn-icon">&#9881;</span> API Key
          </button>
        </div>
      </div>
    </nav>

    <div id="settings-panel" class="settings-panel hidden">
      <div class="settings-inner">
        <div class="settings-group">
          <label class="field-label" for="api-key-input">Gemini API key</label>
          <div class="inline-field">
            <input id="api-key-input" type="password" placeholder="Paste your Gemini key, then press Save" autocomplete="off" spellcheck="false" />
            <button id="save-key-button" class="btn-accent" type="button">Save to .env</button>
          </div>
          <p id="key-status" class="status-line"></p>
        </div>
        <div class="settings-group">
          <label class="field-label" for="dashscope-api-key-input">DashScope API key</label>
          <div class="inline-field">
            <input id="dashscope-api-key-input" type="password" placeholder="Paste your DashScope key for Qwen models" autocomplete="off" spellcheck="false" />
            <button id="save-dashscope-key-button" class="btn-accent" type="button">Save to .env</button>
          </div>
          <p id="dashscope-key-status" class="status-line"></p>
        </div>
        <label class="checkbox-row">
          <input id="show-key-toggle" type="checkbox" />
          <span>Show keys</span>
        </label>
      </div>
    </div>

    <main class="app-layout">
      <aside class="sidebar">
        <section class="sidebar-section">
          <h3 class="sidebar-title">Upload Document</h3>
          <label class="dropzone" for="file-input">
            <input id="file-input" type="file" multiple accept=".txt,.text,.log,.md,.mdx,.json,.csv,.tsv,.html,.htm,.xml,.docx,.js,.jsx,.ts,.tsx,.py,.java,.go,.rb,.rs,.sql,.css,.yaml,.yml" />
            <span class="dropzone-icon">&#128462;</span>
            <span id="selected-file-name">Drop one or more files or click to browse</span>
            <small>Supported: .txt .md .json .csv .docx .html and more</small>
          </label>
          <button id="upload-button" class="btn-accent full-width" type="button" disabled>Upload & Index All</button>
          <p id="upload-status" class="status-line"></p>
        </section>

        <section class="sidebar-section">
          <h3 class="sidebar-title">Web Page <span class="badge">session</span></h3>
          <div class="web-url-row">
            <textarea id="web-url-input" rows="3" placeholder="Paste one or more public URLs" autocomplete="off" spellcheck="false"></textarea>
            <button id="web-summarize-button" class="btn-accent" type="button">Add pages</button>
          </div>
          <p id="web-status" class="status-line"></p>
          <div id="web-page-list" class="file-list"></div>
        </section>

        <section class="sidebar-section">
          <h3 class="sidebar-title">Wiki Files <span class="badge">always on</span></h3>
          <label class="dropzone dropzone-sm" for="wiki-file-input">
            <input id="wiki-file-input" type="file" accept=".md,.txt,.text" />
            <span id="wiki-file-name">Drop .md or .txt here</span>
            <small>Saved to wiki folder, always included in context</small>
          </label>
          <button id="wiki-upload-button" class="btn-accent full-width" type="button" disabled>Add to Wiki</button>
          <p id="wiki-upload-status" class="status-line"></p>
          <div id="wiki-list" class="file-list"></div>
        </section>

        <section class="sidebar-section">
          <h3 class="sidebar-title">Documents</h3>
          <div id="document-list" class="file-list"></div>
        </section>
      </aside>

      <section class="chat-area">
        <div id="chat-log" class="chat-log">
          <div class="msg msg-system">
            <span class="msg-avatar">&#9670;</span>
            <div class="msg-body">
              <p>Hi! Upload documents or ask a question. I can search across all your docs or read full documents end to end.</p>
            </div>
          </div>
        </div>

        <form id="chat-form" class="chat-input-bar">
          <div class="chat-input-stack">
            <div class="mode-select-row">
              <span>Chat mode</span>
              <select id="chat-mode">
                <option value="qa" selected>Q&A</option>
                <option value="full-document">Full document</option>
                <option value="web-pages">Web pages</option>
              </select>
              <span>Model</span>
              <select id="model-select"></select>
              <span>Search mode</span>
              <select id="retrieval-mode">
                <option value="hybrid" selected>Hybrid</option>
                <option value="semantic">Semantic</option>
                <option value="bm25">BM25</option>
              </select>
              <label class="debug-toggle-row">
                <input id="debug-search-toggle" type="checkbox" />
                <span>Debug retrieval only</span>
              </label>
            </div>
            <div id="document-focus-row" class="document-focus-row" hidden>
              <div class="doc-picker-header">
                <span>Target documents</span>
                <div class="doc-picker-actions">
                  <button id="doc-select-all-btn" type="button" class="doc-picker-btn">Select first 5</button>
                  <button id="doc-clear-all-btn" type="button" class="doc-picker-btn">Clear all</button>
                </div>
              </div>
              <div id="doc-picker-list" class="doc-picker-list"></div>
            </div>
            <div id="web-page-focus-row" class="document-focus-row" hidden>
              <div class="doc-picker-header">
                <span>Target web pages</span>
                <div class="doc-picker-actions">
                  <label class="compact-select-label">
                    <span>Read depth</span>
                    <select id="web-page-read-mode">
                      <option value="auto" selected>Auto</option>
                      <option value="fast">Fast</option>
                      <option value="full-scan">Full scan</option>
                    </select>
                  </label>
                  <button id="web-page-select-all-btn" type="button" class="doc-picker-btn">Select all</button>
                  <button id="web-page-clear-all-btn" type="button" class="doc-picker-btn">Clear all</button>
                </div>
              </div>
              <div id="web-page-picker-list" class="doc-picker-list"></div>
            </div>
            <textarea id="chat-input" rows="1" placeholder="Ask anything about your documents..."></textarea>
          </div>
          <button class="btn-send" type="submit" aria-label="Send">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
          </button>
        </form>

        <div class="sources-panel">
          <button id="sources-toggle" class="sources-toggle hidden" type="button">
            <span>&#128269;</span> Retrieved sources
            <span id="sources-count" class="badge">0</span>
          </button>
          <div id="source-list" class="source-list collapsed"></div>
        </div>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
